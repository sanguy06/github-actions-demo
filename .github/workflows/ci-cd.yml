name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test            # only runs if tests pass

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t my-app:${{ github.sha }} .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build           # only runs if the build succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # never deploy from a PR

    steps:
      - name: Trigger deploy
        # Most hosts (e.g. Render) give you a "deploy hook" URL that rebuilds your app when called.
        # Add it in GitHub: Settings > Secrets and variables > Actions > New secret named DEPLOY_HOOK_URL
        run: curl -fsSL -X POST "${{ secrets.DEPLOY_HOOK_URL }}"